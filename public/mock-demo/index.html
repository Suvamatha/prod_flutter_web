  .switch.on { background:var(--accent); }

  .stats3 { display:grid; grid-template-columns:repeat(3,1fr); background:#fff; border-radius:18px; box-shadow:0 0 0 1px var(--line); margin-top:20px; padding:14px 0; text-align:center; }

  nav { display:flex; justify-content:space-around; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:8px 6px 6px; flex-shrink:0; }
  nav button { display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11.5px; font-weight:500; color:var(--muted); min-width:64px; }
  nav .pill { width:56px; height:30px; border-radius:99px; display:grid; place-items:center; transition:background .2s; }
  nav .on { color:var(--ink); font-weight:650; }
  nav .on .pill { background:var(--soft); color:var(--accent); }
  nav svg { width:22px; height:22px; }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:20; animation:fade .2s; }
  .dialog { background:#fff; width:100%; border-radius:28px 28px 0 0; padding:10px 20px 26px; animation:up .28s cubic-bezier(.2,.7,.2,1); }
  .grab { width:36px; height:4px; border-radius:99px; background:#D4D4D8; margin:0 auto 16px; }
  @keyframes fade { from { opacity:0 } }
  @keyframes up { from { transform:translateY(100%) } }
  .field { margin-top:12px; }
  .field label { font-size:12.5px; color:var(--muted); display:block; margin:0 0 6px 2px; }
  .field input, .field textarea { width:100%; border:1px solid #E4E4E7; border-radius:14px; padding:13px 14px; font-size:15px; outline:0; background:#fff; user-select:text; resize:none; }
  .field input:focus, .field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--soft); }
  .err { color:#DC2626; font-size:12px; margin:6px 2px 0; display:none; }
  .invalid .err { display:block; } .invalid input { border-color:#FCA5A5; }
  .snack { position:fixed; left:16px; right:16px; bottom:84px; background:#27272A; color:#fff; border-radius:14px; padding:14px 16px; font-size:14px; z-index:30; animation:up2 .25s; }
  @keyframes up2 { from { opacity:0; transform:translateY(12px) } }
  .empty { text-align:center; padding:40px 0; color:var(--muted); font-size:14px; }
  .center-dialog { position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.4); z-index:25; padding:28px; animation:fade .2s; }
  .center-dialog > div { background:#fff; border-radius:28px; padding:24px; width:100%; animation:pop .22s cubic-bezier(.2,.7,.2,1); }
  @keyframes pop { from { opacity:0; transform:scale(.92) } }
  .center-dialog .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .center-dialog .actions button { padding:10px 14px; border-radius:99px; font-weight:600; color:var(--accent); }
</style>

    '/profile': () => `
      <div class="page" style="text-align:center;padding-top:20px">
        <div class="avatar" style="${img(3)};width:84px;height:84px;margin:0 auto;box-shadow:0 0 0 4px #fff"></div>
        <h2 style="margin-top:12px;font-size:19px">${esc(T.user)}</h2>
        <div class="muted small">Member since 2024</div>
        <div class="stats3"><div><b>${state.saved.size}</b><div class="muted xs">Saved</div></div><div><b>8</b><div class="muted xs">Visits</div></div><div><b>3</b><div class="muted xs">Plans</div></div></div>
        <div class="list" style="text-align:left">
          ${['Notifications', 'Dark mode', 'Location access'].map((l, i) => `<button class="li" data-toggle="${i}"><span class="row"><span class="ico">${['🔔', '🌙', '📍'][i]}</span>${l}</span><span class="switch ${state.toggles[i] ? 'on' : ''}"></span></button>`).join('')}
        </div>
        <div class="list" style="text-align:left">
          <button class="li" data-edit><span class="row"><span class="ico">✎</span>Edit profile</span><span class="muted">›</span></button>
          <button class="li" data-about><span class="row"><span class="ico">ⓘ</span>About this build</span><span class="muted">›</span></button>
          <button class="li" data-signout style="color:#DC2626"><span class="row"><span class="ico" style="background:#FEE2E2;color:#DC2626">⎋</span>Sign out</span></button>
        </div>
      </div>`,
  }

  function renderNav(route) {
    const active = TABS.indexOf(route === '/details' ? '/' : route)
    nav.innerHTML = T.tabs.map((t, i) => `<button class="${i === active ? 'on' : ''}" data-go="${TABS[i]}"><span class="pill">${svg(ICONS[i])}</span>${esc(t)}</button>`).join('')
    nav.style.display = route === '/details' ? 'none' : 'flex'
  }

  let last = null
  function render() {
    let route = location.hash.replace(/^#/, '') || '/'
    if (!screens[route]) route = '/'
    const html = screens[route]()
    view.innerHTML = html
    if (route !== last) view.scrollTop = 0
    last = route
    renderNav(route)
    const qi = document.getElementById('q')
    if (qi) qi.addEventListener('input', (e) => {
      state.query = e.target.value
      const pos = e.target.selectionStart
      render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos)
    })
  }

  function sheet(html) {
    const s = document.createElement('div'); s.className = 'scrim'
    s.innerHTML = `<div class="dialog"><div class="grab"></div>${html}</div>`
    s.addEventListener('click', (e) => { if (e.target === s) s.remove() })
    document.body.appendChild(s); return s
  }
  function confirmDialog(title, body, ok, onOk) {
    const d = document.createElement('div'); d.className = 'center-dialog'
    d.innerHTML = `<div><h2 style="font-size:20px">${title}</h2><p class="body" style="margin:10px 0 0">${body}</p><div class="actions"><button data-x>Cancel</button><button data-ok>${ok}</button></div></div>`
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-x]')) d.remove(); if (e.target.closest('[data-ok]')) { d.remove(); onOk && onOk() } })
    document.body.appendChild(d)
  }

  function openForm() {
    const s = sheet(`
      <h2 style="font-size:20px">${esc(T.cta)}</h2>
      <div class="muted small" style="margin-top:4px">We\u2019ll confirm by email within a few minutes.</div>
      <form id="f" novalidate>
        <div class="field" id="fn"><label>Full name</label><input name="name" placeholder="Your name" autocomplete="name" /><div class="err">Please enter your name</div></div>
        <div class="field" id="fe"><label>Email</label><input name="email" type="email" placeholder="you@example.com" autocomplete="email" /><div class="err">Enter a valid email address</div></div>
        <div class="field"><label>Note (optional)</label><textarea name="note" rows="2" placeholder="Anything we should know?"></textarea></div>
        <button class="cta" type="submit">Confirm</button>
      </form>`)
    setTimeout(() => s.querySelector('input').focus(), 250)
    s.querySelector('#f').addEventListener('submit', (e) => {
      e.preventDefault()
      const f = e.target, okName = f.name.value.trim().length > 1, okEmail = /^\S+@\S+\.\S+$/.test(f.email.value)
      s.querySelector('#fn').classList.toggle('invalid', !okName)
      s.querySelector('#fe').classList.toggle('invalid', !okEmail)
      if (!okName || !okEmail) return
      s.remove()
      confirmDialog('All set 🎉', `Thanks, ${esc(f.name.value.trim().split(' ')[0])}. A confirmation is on its way to ${esc(f.email.value)}.`, 'Done')
    })
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return
    if (t.dataset.go !== undefined) { go(t.dataset.go); return }
    if (t.dataset.open !== undefined) { state.current = t.dataset.open === 'hero' ? 'hero' : +t.dataset.open; go('/details'); return }
    if (t.dataset.fav !== undefined) {
      e.stopPropagation(); const i = +t.dataset.fav
      state.saved.has(i) ? state.saved.delete(i) : state.saved.add(i)
      snack(state.saved.has(i) ? 'Saved' : 'Removed from saved'); render(); return
    }
    if (t.dataset.chip !== undefined) { state.chip = +t.dataset.chip; render(); return }
    if (t.dataset.toggle !== undefined) { const i = +t.dataset.toggle; state.toggles[i] = !state.toggles[i]; render(); return }
    if (t.hasAttribute('data-back')) { history.length > 1 ? history.back() : go('/'); return }
    if (t.hasAttribute('data-form')) { openForm(); return }
    if (t.hasAttribute('data-share')) { snack('Link copied to clipboard'); return }
    if (t.hasAttribute('data-signout')) { confirmDialog('Sign out?', 'You can sign back in anytime.', 'Sign out', () => snack('Signed out (demo)')); return }
    if (t.hasAttribute('data-about')) { confirmDialog('About this build', `Placeholder build <span style="font-family:monospace">${esc(q.get('build') || 'dev')}</span>. When the FlutterShow build service is connected, the real <b>flutter build web</b> output is served here instead.`, 'OK'); return }
    if (t.hasAttribute('data-edit')) {
      const s = sheet(`<h2 style="font-size:20px">Edit profile</h2><div class="field"><label>Display name</label><input id="dn" value="${esc(T.user)}" /></div><button class="cta" id="sv">Save</button>`)
      s.querySelector('#sv').onclick = () => { const v = s.querySelector('#dn').value.trim(); if (v) T.user = v; s.remove(); render(); snack('Profile updated') }
    }
  })

  window.addEventListener('hashchange', render)
  render()
})()
</script>
</body>
</html>
