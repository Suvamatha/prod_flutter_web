name: FlutterShow build worker
run-name: Build ${{ inputs.project_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
        type: string
      project_id:
        required: true
        type: string
      repository:
        required: true
        type: string
      path:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fluttershow-${{ inputs.project_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout FlutterShow worker
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install worker dependencies
        run: npm ci --omit=dev

      - name: Build and publish demo
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          REPOSITORY_URL: ${{ inputs.repository }}
          APP_PATH: ${{ inputs.path }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/worker-build.mjs
